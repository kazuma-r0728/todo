<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>TODO</h1>
      <p class="app__date" id="today"></p>
    </header>

    <form class="add-form" id="addForm">
      <input
        type="text"
        id="taskInput"
        class="add-form__input"
        placeholder="やることを入力..."
        autocomplete="off"
        maxlength="200"
      >
      <select id="prioritySelect" class="add-form__priority">
        <option value="low">低</option>
        <option value="normal" selected>中</option>
        <option value="high">高</option>
      </select>
      <button type="submit" class="add-form__button">追加</button>
    </form>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="filter-btn is-active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="completed">完了済み</button>
      </div>
      <button class="clear-btn" id="clearCompleted">完了済みを削除</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <p class="empty-state" id="emptyState">タスクはまだありません</p>

    <footer class="app__footer">
      <span id="itemsLeft">0 件の未完了タスク</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
